name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell syntax
        run: for file in bin/* install.sh uninstall.sh tests/run.sh packaging/arch/gsr-replay.install; do bash -n "$file"; done
      - name: Run shellcheck
        run: shellcheck bin/* install.sh uninstall.sh tests/run.sh
      - name: Run tests
        run: bash tests/run.sh
      - name: Verify systemd service
        run: install -Dm755 bin/gsr-replay "$HOME/.local/bin/gsr-replay" && systemd-analyze --user verify systemd/gsr-replay.service

  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Install package validators
        run: pacman -Syu --noconfirm --needed git namcap pacman-contrib shellcheck
      - name: Build current source payload
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'bash packaging/arch/create-source-archive'
          su builder -c 'cd packaging/arch && updpkgsums'
          su builder -c 'cd packaging/arch && makepkg --cleanbuild --nodeps --noconfirm'
      - name: Inspect package
        run: namcap packaging/arch/PKGBUILD packaging/arch/gsr-replay-*.pkg.tar.zst
